name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "4"
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Active Record ${{ matrix.activerecord }} on ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        activerecord: ["~> 8.0.4", "~> 8.1.1", "main"]
        ruby: ["3.3", "3.4", "4.0"]
    env:
      AR: ${{ matrix.activerecord }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4"
          bundler-cache: true

      - name: Test
        run: bundle exec rspec
